                this.gridSpacingYInput = document.getElementById('gridSpacingY');
                this.tilesXInput = document.getElementById('tilesX');
                this.tilesYInput = document.getElementById('tilesY');
                this.randomRotationCheckbox = document.getElementById('randomRotation');
                this.editPreviewCheckbox = document.getElementById('editPreview');
                this.undoButton = document.getElementById('undoButton');
                this.redoButton = document.getElementById('redoButton');
                this.exportVariationsButton = document.getElementById('exportVariations');
                this.exportTextureButton = document.getElementById('exportTexture');
                this.addVariationBtn = document.getElementById('addVariationBtn');
                this.hiddenFileInput = document.getElementById('hiddenFileInput');
                
                this.init();
            }
            
            init() {
                this.collapsibleSections = new CollapsibleSections();
                this.resizablePanel = new ResizablePanel();
                
                this.colorPicker = new ColorPicker((color) => {
                    this.currentColor = color;
                });
                
                this.createCanvas();
                this.setupEventListeners();
                this.setupGlobalCursorHandling();
            }
            
            setupGlobalCursorHandling() {
                // Global mouse move for cursor box
                document.addEventListener('mousemove', (e) => {
                    // Check if mouse is over any canvas
                    let overCanvas = false;
                    let pixelSize = 0;
                    
                    // Check editor canvases
                    for (let canvas of this.canvasArray) {
                        if (canvas.matches(':hover')) {
                            overCanvas = true;
                            pixelSize = this.pixelSize;
                            break;
                        }
                    }
                    
                    // Check texture canvas
                    if (!overCanvas && this.textureCanvas.matches(':hover') && this.editPreview) {
                        overCanvas = true;
                        pixelSize = this.texturePixelSize;
                    }
                    
                    if (overCanvas && !e.altKey) {
                        // Show and position cursor box
                        this.cursorBox.style.display = 'block';
                        this.cursorBox.style.width = pixelSize + 'px';
                        this.cursorBox.style.height = pixelSize + 'px';
                        
                        // Snap to pixel grid
                        const rect = e.target.getBoundingClientRect();
                        const x = Math.floor((e.clientX - rect.left) / pixelSize) * pixelSize + rect.left;
                        const y = Math.floor((e.clientY - rect.top) / pixelSize) * pixelSize + rect.top;
                        
                        this.cursorBox.style.left = x + 'px';
                        this.cursorBox.style.top = y + 'px';
                    } else {
                        this.cursorBox.style.display = 'none';
                    }
                });
                
                // Hide cursor when leaving the window
                document.addEventListener('mouseleave', () => {
                    this.cursorBox.style.display = 'none';
                });
            }
            
            // Bresenham's line algorithm for pixel-perfect lines
            drawLine(x0, y0, x1, y1, callback) {
                const dx = Math.abs(x1 - x0);
                const dy = Math.abs(y1 - y0);
                const sx = x0 < x1 ? 1 : -1;
                const sy = y0 < y1 ? 1 : -1;
                let err = dx - dy;
                
                while (true) {
                    callback(x0, y0);
                    
                    if (x0 === x1 && y0 === y1) break;
                    
                    const e2 = 2 * err;
                    if (e2 > -dy) {
                        err -= dy;
                        x0 += sx;
                    }
                    if (e2 < dx) {
                        err += dx;
                        y0 += sy;
                    }
                }
            }
            
            addNewVariation() {
                if (this.variations >= 8) {
                    alert('Maximum 8 variations allowed');
                    return;
                }
                
                this.historyManager.saveState(this.pixelDataArray, this.variations, this.gridWidth, this.gridHeight);
                
                this.variations++;
                const index = this.variations - 1;
                
                // Add new pixel data
                this.pixelDataArray[index] = Array(this.gridHeight).fill(null).map(() => 
                    Array(this.gridWidth).fill('#FFFFFF')
                );
                
                // Create new canvas element
                this.createVariationCanvas(index);
                
                // Regenerate tile data to include new variation
                this.generateTileData();
                this.resizeCanvas();
            }
            
            createVariationCanvas(index) {
                const wrapper = document.createElement('div');
                wrapper.className = 'variation-wrapper';
                wrapper.id = `variation-wrapper-${index}`;
                
                const container = document.createElement('div');
                container.className = 'variation-canvas-container';
                
                const canvas = document.createElement('canvas');
                canvas.id = `pixelCanvas${index}`;
                
                // Create controls
                const controls = document.createElement('div');
                controls.className = 'variation-controls';
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'variation-control-btn remove';
                removeBtn.innerHTML = '−';
                removeBtn.title = 'Remove variation';
                removeBtn.onclick = () => this.removeVariation(index);
                
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'variation-control-btn';
                downloadBtn.innerHTML = '↓';
                downloadBtn.title = 'Download variation';
                downloadBtn.onclick = () => this.exportVariation(index);
                
                const uploadBtn = document.createElement('button');
                uploadBtn.className = 'variation-control-btn';
                uploadBtn.innerHTML = '↑';
                uploadBtn.title = 'Upload texture';
                uploadBtn.onclick = () => this.triggerUpload(index);
                
                controls.appendChild(removeBtn);
                controls.appendChild(downloadBtn);
                controls.appendChild(uploadBtn);
                
                container.appendChild(canvas);
                wrapper.appendChild(container);
                wrapper.appendChild(controls);
                
                this.variationsContainer.appendChild(wrapper);
                
                this.canvasArray[index] = canvas;
                this.ctxArray[index] = canvas.getContext('2d');
                
                this.setupCanvasEventListeners(canvas, index);
            }
            
            removeVariation(index) {
                if (this.variations <= 1) {
                    alert('Cannot remove the last variation');
                    return;
                }
                
                this.historyManager.saveState(this.pixelDataArray, this.variations, this.gridWidth, this.gridHeight);
                
                // Remove the wrapper element
                const wrapper = document.getElementById(`variation-wrapper-${index}`);
                if (wrapper) {
                    wrapper.remove();
                }
                
                // Remove from arrays
                this.pixelDataArray.splice(index, 1);
                this.canvasArray.splice(index, 1);
                this.ctxArray.splice(index, 1);
                
                this.variations--;
                
                // Re-index remaining variations and re-attach event listeners
                for (let i = 0; i < this.variations; i++) {
                    const wrapper = this.variationsContainer.children[i];
                    wrapper.id = `variation-wrapper-${i}`;
                    const canvas = wrapper.querySelector('canvas');
                    canvas.id = `pixelCanvas${i}`;
                    
                    // Update canvas and context references
                    this.canvasArray[i] = canvas;
                    this.ctxArray[i] = canvas.getContext('2d');
                    
                    // Remove old event listeners by cloning the canvas
                    const newCanvas = canvas.cloneNode(true);
                    canvas.parentNode.replaceChild(newCanvas, canvas);
                    
                    // Update the reference and re-attach event listeners
                    this.canvasArray[i] = newCanvas;
                    this.ctxArray[i] = newCanvas.getContext('2d');
                    this.setupCanvasEventListeners(newCanvas, i);
                    
                    // Update button handlers
                    const buttons = wrapper.querySelectorAll('.variation-control-btn');
                    buttons[0].onclick = () => this.removeVariation(i);
                    buttons[1].onclick = () => this.exportVariation(i);
                    buttons[2].onclick = () => this.triggerUpload(i);
                }
                
                // Regenerate tile data
                this.generateTileData();
                this.resizeCanvas();
            }
            
            triggerUpload(index) {
                this.pendingUploadIndex = index;
                this.hiddenFileInput.click();
            }
            
            handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file || this.pendingUploadIndex === -1) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.processUploadedImage(img, this.pendingUploadIndex);
                        this.pendingUploadIndex = -1;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
                
                // Reset file input
                event.target.value = '';
            }
            
            processUploadedImage(img, variationIndex) {
                this.historyManager.saveState(this.pixelDataArray, this.variations, this.gridWidth, this.gridHeight);
                
                // Create temporary canvas for processing
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                
                // Set canvas to target size
                tempCanvas.width = this.gridWidth;
                tempCanvas.height = this.gridHeight;
                
                // Draw scaled image
                tempCtx.imageSmoothingEnabled = false;
                tempCtx.drawImage(img, 0, 0, this.gridWidth, this.gridHeight);
                
                // Extract pixel data
                const imageData = tempCtx.getImageData(0, 0, this.gridWidth, this.gridHeight);
                const pixels = imageData.data;
                
                // Update pixel data array
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        const i = (y * this.gridWidth + x) * 4;
                        const r = pixels[i];
                        const g = pixels[i + 1];
                        const b = pixels[i + 2];
                        const a = pixels[i + 3];
                        
                        if (a > 127) { // If pixel is mostly opaque
                            const hex = '#' + 
                                r.toString(16).padStart(2, '0') + 
                                g.toString(16).padStart(2, '0') + 
                                b.toString(16).padStart(2, '0');
                            this.pixelDataArray[variationIndex][y][x] = hex.toUpperCase();
                        } else {
                            this.pixelDataArray[variationIndex][y][x] = '#FFFFFF';
                        }
                    }
                }
                
                // Redraw
                this.redraw(variationIndex);
                this.updateTexturePreview();
            }
            
            setupEventListeners() {
                this.createButton.addEventListener('click', () => {
                    const newWidth = parseInt(this.widthInput.value);
                    const newHeight = parseInt(this.heightInput.value);
                    
                    if (newWidth !== this.gridWidth || newHeight !== this.gridHeight) {
                        if (confirm('Changing canvas size will clear all variations. Continue?')) {
                            this.pixelDataArray = [];
                            this.historyManager.clear();
                            this.createCanvas();
                        }
                    }
                });
                
                this.clearButton.addEventListener('click', () => {
                    this.historyManager.saveState(this.pixelDataArray, this.variations, this.gridWidth, this.gridHeight);
                    this.clearAllCanvas();
                });
                
                this.undoButton.addEventListener('click', () => this.performUndo());
                this.redoButton.addEventListener('click', () => this.performRedo());
                this.exportVariationsButton.addEventListener('click', () => this.exportAllVariations());
                this.exportTextureButton.addEventListener('click', () => this.exportTexture());
                this.addVariationBtn.addEventListener('click', () => this.addNewVariation());
                
                this.hiddenFileInput.addEventListener('change', (e) => this.handleImageUpload(e));
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    // Prevent undo/redo when typing in input fields
                    if (e.target.tagName === 'INPUT') return;
                    
                    if (e.ctrlKey || e.metaKey) {
                        if (e.key === 'z' && !e.shiftKey) {
                            e.preventDefault();
                            this.performUndo();
                        } else if ((e.key === 'z' && e.shiftKey) || e.key === 'y') {
                            e.preventDefault();
                            this.performRedo();
                        }
                    }
                    
                    if (e.key === 'Alt') {
                        this.cursorBox.style.display = 'none';
                        this.canvasArray.forEach(canvas => {
                            if (canvas.matches(':hover')) {
                                canvas.style.cursor = 'crosshair';
                            }
                        });
                        if (this.editPreview && this.textureCanvas.matches(':hover')) {
                            this.textureCanvas.style.cursor = 'crosshair';
                        }
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    if (e.key === 'Alt') {
                        this.canvasArray.forEach(canvas => {
                            canvas.style.cursor = 'none';
                        });
                        if (this.editPreview) {
                            this.textureCanvas.style.cursor = 'none';
                        } else {
                            this.textureCanvas.style.cursor = 'default';
                        }
                    }
                });
                
                this.showGridCheckbox.addEventListener('change', (e) => {
                    this.showGrid = e.target.checked;
                    this.redrawAll();
                });
                
                this.gridSpacingXInput.addEventListener('input', (e) => {
                    this.gridSpacingX = parseInt(e.target.value) || 1;
                    this.redrawAll();
                });
                
                this.gridSpacingYInput.addEventListener('input', (e) => {
                    this.gridSpacingY = parseInt(e.target.value) || 1;
                    this.redrawAll();
                });
                
                this.tilesXInput.addEventListener('input', (e) => {
                    this.tilesX = parseInt(e.target.value) || 1;
                    this.generateTileData();
                    this.resizeCanvas();
                });
                
                this.tilesYInput.addEventListener('input', (e) => {
                    this.tilesY = parseInt(e.target.value) || 1;
                    this.generateTileData();
                    this.resizeCanvas();
                });
                
                this.randomRotationCheckbox.addEventListener('change', (e) => {
                    this.randomRotation = e.target.checked;
                    this.generateTileData();
                    this.updateTexturePreview();
                });
                
                this.editPreviewCheckbox.addEventListener('change', (e) => {
                    this.editPreview = e.target.checked;
                    this.updateCursorStyles();
                    this.updateTextureInfo();
                });
                
                // Texture canvas event listeners
                this.textureCanvas.addEventListener('mousedown', (e) => {
                    if (this.editPreview) {
                        if (e.altKey) {
                            this.pickColorFromTexture(e);
                        } else {
                            this.strokeStarted = false;
                            this.lastTexturePixel = null;
                            this.isDrawingOnTexture = true;
                            this.paintTexturePixel(e);
                        }
                    }
                });
                
                this.textureCanvas.addEventListener('mousemove', (e) => {
                    if (this.editPreview) {
                        if (e.altKey) {
                            this.textureCanvas.style.cursor = 'crosshair';
                            this.cursorBox.style.display = 'none';
                        } else {
                            this.textureCanvas.style.cursor = 'none';
                            if (this.isDrawingOnTexture) {
                                this.paintTexturePixel(e);
                            }
                        }
                    }
                });
                
                this.textureCanvas.addEventListener('mouseup', () => {
                    this.isDrawingOnTexture = false;
                    this.strokeStarted = false;
                    this.lastTexturePixel = null;
                });
                
                this.textureCanvas.addEventListener('mouseleave', () => {
                    this.isDrawingOnTexture = false;
                    this.strokeStarted = false;
                    this.lastTexturePixel = null;
                    if (this.editPreview) {
                        this.textureCanvas.style.cursor = 'none';
                    } else {
                        this.textureCanvas.style.cursor = 'default';
                    }
                });
                
                window.addEventListener('resize', () => this.resizeCanvas());
            }
            
            exportAllVariations() {
                for (let i = 0; i < this.variations; i++) {
                    this.exportVariation(i);
                }
            }
            
            exportVariation(variationIndex) {
                const pixelData = this.pixelDataArray[variationIndex];
                if (!pixelData) return;
                
                // Create a temporary canvas at actual pixel size
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = this.gridWidth;
                tempCanvas.height = this.gridHeight;
                const tempCtx = tempCanvas.getContext('2d');
                
                // Fill with white background
                tempCtx.fillStyle = '#FFFFFF';
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                
                // Draw pixels
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        if (pixelData[y] && pixelData[y][x] !== '#FFFFFF') {
                            tempCtx.fillStyle = pixelData[y][x];
                            tempCtx.fillRect(x, y, 1, 1);
                        }
                    }
                }
                
                // Convert to blob and download
                tempCanvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `pixel-art-variation-${variationIndex + 1}-${this.gridWidth}x${this.gridHeight}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            }
            
            exportTexture() {
                // Create a temporary canvas at actual pixel size
                const textureWidth = this.gridWidth * this.tilesX;
                const textureHeight = this.gridHeight * this.tilesY;
                
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = textureWidth;
                tempCanvas.height = textureHeight;
                const tempCtx = tempCanvas.getContext('2d');
                
                // Fill with white background
                tempCtx.fillStyle = '#FFFFFF';
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                
                // Draw tiles
                for (let tileY = 0; tileY < this.tilesY; tileY++) {
                    for (let tileX = 0; tileX < this.tilesX; tileX++) {
                        const rotation = this.tileRotations[tileY] ? this.tileRotations[tileY][tileX] : 0;
                        const variation = this.tileVariations[tileY] ? this.tileVariations[tileY][tileX] : 0;
                        const pixelData = this.pixelDataArray[variation] || this.pixelDataArray[0];
                        
                        // Draw each pixel of the tile
                        for (let srcY = 0; srcY < this.gridHeight; srcY++) {
                            for (let srcX = 0; srcX < this.gridWidth; srcX++) {
                                if (pixelData && pixelData[srcY] && pixelData[srcY][srcX] !== '#FFFFFF') {
                                    // Apply rotation to determine destination position
                                    const rotated = this.rotatePixelCoordinates(srcX, srcY, rotation, this.gridWidth, this.gridHeight);
                                    
                                    // Calculate final position in texture
                                    const destX = tileX * this.gridWidth + rotated.x;
                                    const destY = tileY * this.gridHeight + rotated.y;
                                    
                                    // Draw the pixel
                                    tempCtx.fillStyle = pixelData[srcY][srcX];
                                    tempCtx.fillRect(destX, destY, 1, 1);
                                }
                            }
                        }
                    }
                }
                
                // Convert to blob and download
                tempCanvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const rotationText = this.randomRotation ? '-rotated' : '';
                    const variationText = this.variations > 1 ? `-${this.variations}var` : '';
                    a.download = `texture-${this.tilesX}x${this.tilesY}-tiles-${textureWidth}x${textureHeight}px${rotationText}${variationText}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            }
            
            performUndo() {
                const state = this.historyManager.undo();
                if (state) {
                    this.loadState(state);
                }
            }
            
            performRedo() {
                const state = this.historyManager.redo();
                if (state) {
                    this.loadState(state);
                }
            }
            
            loadState(state) {
                // Only load if dimensions match current canvas
                if (state.gridWidth === this.gridWidth && 
                    state.gridHeight === this.gridHeight) {
                    
                    // Update variations count if different
                    if (state.variations !== this.variations) {
                        // Clear current variations
                        this.variationsContainer.innerHTML = '';
                        this.canvasArray = [];
                        this.ctxArray = [];
                        
                        this.variations = state.variations;
                        
                        // Recreate variation canvases
                        for (let i = 0; i < this.variations; i++) {
                            this.createVariationCanvas(i);
                        }
                    }
                    
                    // Deep copy the state to avoid reference issues
                    this.pixelDataArray = state.pixelData.map(variation => 
                        variation ? variation.map(row => [...row]) : null
                    );
                    
                    // Redraw everything
                    this.generateTileData();
                    this.resizeCanvas();
                }
            }
            
            updateCursorStyles() {
                if (this.editPreview) {
                    this.textureCanvas.style.cursor = 'crosshair';
                } else {
                    this.textureCanvas.style.cursor = 'default';
                }
            }
            
            paintTexturePixel(e) {
                const rect = this.textureCanvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / this.texturePixelSize);
                const y = Math.floor((e.clientY - rect.top) / this.texturePixelSize);
                
                const tileX = Math.floor(x / this.gridWidth);
                const tileY = Math.floor(y / this.gridHeight);
                
                if (tileX >= 0 && tileX < this.tilesX && tileY >= 0 && tileY < this.tilesY) {
                    const pixelX = x % this.gridWidth;
                    const pixelY = y % this.gridHeight;
                    
                    const variation = this.tileVariations[tileY] ? this.tileVariations[tileY][tileX] : 0;
                    const rotation = this.tileRotations[tileY] ? this.tileRotations[tileY][tileX] : 0;
                    
                    const unrotated = this.unrotatePixelCoordinates(pixelX, pixelY, rotation, this.gridWidth, this.gridHeight);
                    
                    if (unrotated.x >= 0 && unrotated.x < this.gridWidth && 
                        unrotated.y >= 0 && unrotated.y < this.gridHeight) {
                        
                        const pixelData = this.pixelDataArray[variation];
                        if (pixelData) {
                            // Save state before first pixel in stroke
                            if (!this.strokeStarted) {
                                this.historyManager.saveState(this.pixelDataArray, this.variations, this.gridWidth, this.gridHeight);
                                this.strokeStarted = true;
                            }
                            
                            pixelData[unrotated.y][unrotated.x] = this.currentColor;
                            
                            this.redraw(variation);
                            this.updateTexturePreview();
                        }
                    }
                }
            }
            
            pickColorFromTexture(e) {
                const rect = this.textureCanvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / this.texturePixelSize);
                const y = Math.floor((e.clientY - rect.top) / this.texturePixelSize);
                
                const tileX = Math.floor(x / this.gridWidth);
                const tileY = Math.floor(y / this.gridHeight);
                
                if (tileX >= 0 && tileX < this.tilesX && tileY >= 0 && tileY < this.tilesY) {
                    const pixelX = x % this.gridWidth;
                    const pixelY = y % this.gridHeight;
                    
                    const variation = this.tileVariations[tileY] ? this.tileVariations[tileY][tileX] : 0;
                    const rotation = this.tileRotations[tileY] ? this.tileRotations[tileY][tileX] : 0;
                    
                    const unrotated = this.unrotatePixelCoordinates(pixelX, pixelY, rotation, this.gridWidth, this.gridHeight);
                    
                    if (unrotated.x >= 0 && unrotated.x < this.gridWidth && 
                        unrotated.y >= 0 && unrotated.y < this.gridHeight) {
                        
                        const pixelData = this.pixelDataArray[variation];
                        if (pixelData) {
                            const pickedColor = pixelData[unrotated.y][unrotated.x];
                            this.currentColor = pickedColor;
                            
                            const r = parseInt(pickedColor.substr(1, 2), 16);
                            const g = parseInt(pickedColor.substr(3, 2), 16);
                            const b = parseInt(pickedColor.substr(5, 2), 16);
                            
                            this.colorPicker.setColorFromRGB(r, g, b);
                        }
                    }
                }
            }
            
            unrotatePixelCoordinates(x, y, rotation, width, height) {
                const centerX = width / 2;
                const centerY = height / 2;
                
                let tx = x - centerX + 0.5;
                let ty = y - centerY + 0.5;
                
                let newX, newY;
                switch (rotation) {
                    case 90:
                        newX = ty;
                        newY = -tx;
                        break;
                    case 180:
                        newX = -tx;
                        newY = -ty;
                        break;
                    case 270:
                        newX = -ty;
                        newY = tx;
                        break;
                    default:
                        newX = tx;
                        newY = ty;
                        break;
                }
                
                newX = Math.floor(newX + centerX - 0.5);
                newY = Math.floor(newY + centerY - 0.5);
                
                return { x: newX, y: newY };
            }
            
            setupCanvasEventListeners(canvas, variationIndex) {
                canvas.addEventListener('mousedown', (e) => {
                    this.activeVariation = variationIndex;
                    if (e.altKey) {
                        this.pickColor(e, variationIndex);
                    } else {
                        this.strokeStarted = false;
                        this.lastPixel = null;
                        this.isDrawing = true;
                        this.paintPixel(e, variationIndex);
                    }
                });
                
                canvas.addEventListener('mousemove', (e) => {
                    if (e.altKey) {
                        canvas.style.cursor = 'crosshair';
                        this.cursorBox.style.display = 'none';
                    } else {
                        canvas.style.cursor = 'none';
                        if (this.isDrawing && this.activeVariation === variationIndex) {
                            this.paintPixel(e, variationIndex);
                        }
                    }
                });
                
                canvas.addEventListener('mouseup', () => {
                    if (this.activeVariation === variationIndex) {
                        this.isDrawing = false;
                        this.strokeStarted = false;
                        this.lastPixel = null;
                    }
                });
                
                canvas.addEventListener('mouseleave', () => {
                    if (this.activeVariation === variationIndex) {
                        this.isDrawing = false;
                        this.strokeStarted = false;
                        this.lastPixel = null;
                    }
                    canvas.style.cursor = 'none';
                });
            }
            
            generateTileData() {
                this.tileRotations = [];
                for (let y = 0; y < this.tilesY; y++) {
                    this.tileRotations[y] = [];
                    for (let x = 0; x < this.tilesX; x++) {
                        if (this.randomRotation) {
                            const rotations = [0, 90, 180, 270];
                            this.tileRotations[y][x] = rotations[Math.floor(Math.random() * 4)];
                        } else {
                            this.tileRotations[y][x] = 0;
                        }
                    }
                }
                
                this.tileVariations = [];
                for (let y = 0; y < this.tilesY; y++) {
                    this.tileVariations[y] = [];
                    for (let x = 0; x < this.tilesX; x++) {
                        this.tileVariations[y][x] = Math.floor(Math.random() * this.variations);
                    }
                }
            }
            
            createCanvas() {
                this.gridWidth = parseInt(this.widthInput.value);
                this.gridHeight = parseInt(this.heightInput.value);
                
                this.variationsContainer.innerHTML = '';
                this.canvasArray = [];
                this.ctxArray = [];
                
                // If we don't have pixel data, initialize it
                if (this.pixelDataArray.length === 0) {
                    this.variations = 1;
                    this.pixelDataArray = [
                        Array(this.gridHeight).fill(null).map(() => 
                            Array(this.gridWidth).fill('#FFFFFF')
                        )
                    ];
                }
                
                // Create canvases for existing variations
                for (let i = 0; i < this.variations; i++) {
                    this.createVariationCanvas(i);
                }
                
                // Save initial state to history
                this.historyManager.saveState(this.pixelDataArray, this.variations, this.gridWidth, this.gridHeight);
                
                this.generateTileData();
                this.resizeCanvas();
            }
            
            getLayoutGrid() {
                switch (this.variations) {
                    case 1: return [1, 1];
                    case 2: return [1, 2];
                    case 3: return [1, 3];
                    case 4: return [1, 4];
                    case 5:
                    case 6: return [2, 3];
                    case 7:
                    case 8: return [2, 4];
                    default: return [1, 1];
                }
            }
            
            resizeCanvas() {
                const container = this.mainContent.getBoundingClientRect();
                const padding = 40;
                const bottomSpace = 80; // Increased to account for add button
                
                const editorWidth = (container.width - padding) / 2;
                const maxHeight = container.height - padding - bottomSpace;
                
                const [cols, rows] = this.getLayoutGrid();
                
                this.variationsContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                this.variationsContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
                
                const gap = 10;
                const containerPadding = 16;
                
                const availableWidth = editorWidth - (cols - 1) * gap;
                const availableHeight = maxHeight - (rows - 1) * gap;
                
                const canvasMaxWidth = (availableWidth / cols) - containerPadding;
                const canvasMaxHeight = (availableHeight / rows) - containerPadding;
                
                const scaleX = canvasMaxWidth / this.gridWidth;
                const scaleY = canvasMaxHeight / this.gridHeight;
                const variationPixelSize = Math.floor(Math.min(scaleX, scaleY));
                
                this.pixelSize = Math.max(2, variationPixelSize);
                
                for (let i = 0; i < this.variations; i++) {
                    this.canvasArray[i].width = this.gridWidth * this.pixelSize;
                    this.canvasArray[i].height = this.gridHeight * this.pixelSize;
                }
                
                const textureGridWidth = this.gridWidth * this.tilesX;
                const textureGridHeight = this.gridHeight * this.tilesY;
                const textureWidth = editorWidth;
                const textureScaleX = textureWidth / textureGridWidth;
                const textureScaleY = maxHeight / textureGridHeight;
                this.texturePixelSize = Math.floor(Math.min(textureScaleX, textureScaleY));
                this.texturePixelSize = Math.max(1, this.texturePixelSize);
                
                this.textureCanvas.width = textureGridWidth * this.texturePixelSize;
                this.textureCanvas.height = textureGridHeight * this.texturePixelSize;
                
                this.scale = this.pixelSize;
                this.textureScale = this.texturePixelSize;
                
                this.updateCanvasInfo();
                this.updateTextureInfo();
                this.redrawAll();
                this.updateTexturePreview();
            }
            
            updateCanvasInfo() {
                const variationText = this.variations > 1 ? ` • ${this.variations} variations` : '';
                this.canvasInfo.textContent = `${this.gridWidth}x${this.gridHeight} • Scale: ${this.scale}x${variationText} • Alt+Click to pick color`;
            }
            
            updateTextureInfo() {
                const totalWidth = this.gridWidth * this.tilesX;
                const totalHeight = this.gridHeight * this.tilesY;
                const rotationText = this.randomRotation ? ' • Rotated' : '';
                const variationText = this.variations > 1 ? ` • ${this.variations} variations` : '';
                const editText = this.editPreview ? ' • EDITING' : '';
                this.textureInfo.textContent = `${this.tilesX}x${this.tilesY} tiles • ${totalWidth}x${totalHeight}px • Scale: ${this.textureScale}x${rotationText}${variationText}${editText}`;
            }
            
            clearAllCanvas() {
                for (let i = 0; i < this.variations; i++) {
                    this.pixelDataArray[i] = Array(this.gridHeight).fill(null).map(() => 
                        Array(this.gridWidth).fill('#FFFFFF')
                    );
                }
                this.redrawAll();
                this.updateTexturePreview();
            }
            
            redrawAll() {
                for (let i = 0; i < this.variations; i++) {
                    this.redraw(i);
                }
            }
            
            redraw(variationIndex) {
                const ctx = this.ctxArray[variationIndex];
                const canvas = this.canvasArray[variationIndex];
                const pixelData = this.pixelDataArray[variationIndex];
                
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (let y = 0; y < this.gridHeight; y++) {
                    for (let x = 0; x < this.gridWidth; x++) {
                        if (pixelData[y] && pixelData[y][x] !== '#FFFFFF') {
                            ctx.fillStyle = pixelData[y][x];
                            ctx.fillRect(
                                x * this.pixelSize,
                                y * this.pixelSize,
                                this.pixelSize,
                                this.pixelSize
                            );
                        }
                    }
                }
                
                if (this.showGrid) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                    ctx.lineWidth = 1;
                    
                    for (let i = 0; i <= this.gridWidth; i += this.gridSpacingX) {
                        ctx.beginPath();
                        ctx.moveTo(i * this.pixelSize, 0);
                        ctx.lineTo(i * this.pixelSize, canvas.height);
                        ctx.stroke();
                    }
                    
                    for (let i = 0; i <= this.gridHeight; i += this.gridSpacingY) {
                        ctx.beginPath();
                        ctx.moveTo(0, i * this.pixelSize);
                        ctx.lineTo(canvas.width, i * this.pixelSize);
                        ctx.stroke();
                    }
                }
            }
            
            rotatePixelCoordinates(x, y, rotation, width, height) {
                const centerX = width / 2;
                const centerY = height / 2;
                
                let tx = x - centerX + 0.5;
                let ty = y - centerY + 0.5;
                
                let newX, newY;
                switch (rotation) {
                    case 90:
                        newX = -ty;
                        newY = tx;
                        break;
                    case 180:
                        newX = -tx;
                        newY = -ty;
                        break;
                    case 270:
                        newX = ty;
                        newY = -tx;
                        break;
                    default:
                        newX = tx;
                        newY = ty;
                        break;
                }
                
                newX = Math.floor(newX + centerX - 0.5);
                newY = Math.floor(newY + centerY - 0.5);
                
                return { x: newX, y: newY };
            }
            
            updateTexturePreview() {
                this.textureCtx.fillStyle = '#FFFFFF';
                this.textureCtx.fillRect(0, 0, this.textureCanvas.width, this.textureCanvas.height);
                
                this.updateTextureInfo();
                
                for (let tileY = 0; tileY < this.tilesY; tileY++) {
                    for (let tileX = 0; tileX < this.tilesX; tileX++) {
                        const rotation = this.tileRotations[tileY] ? this.tileRotations[tileY][tileX] : 0;
                        const variation = this.tileVariations[tileY] ? this.tileVariations[tileY][tileX] : 0;
                        const pixelData = this.pixelDataArray[variation] || this.pixelDataArray[0];
                        
                        for (let srcY = 0; srcY < this.gridHeight; srcY++) {
                            for (let srcX = 0; srcX < this.gridWidth; srcX++) {
                                if (pixelData[srcY] && pixelData[srcY][srcX] !== '#FFFFFF') {
                                    const rotated = this.rotatePixelCoordinates(srcX, srcY, rotation, this.gridWidth, this.gridHeight);
                                    
                                    const destX = (tileX * this.gridWidth + rotated.x) * this.texturePixelSize;
                                    const destY = (tileY * this.gridHeight + rotated.y) * this.texturePixelSize;
                                    
                                    this.textureCtx.fillStyle = pixelData[srcY][srcX];
                                    this.textureCtx.fillRect(
                                        destX,
                                        destY,
                                        this.texturePixelSize,
                                        this.texturePixelSize
                                    );
                                }
                            }
                        }
                    }
                }
            }
            
            pickColor(e, variationIndex) {
                const canvas = this.canvasArray[variationIndex];
                const pixelData = this.pixelDataArray[variationIndex];
                const rect = canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / this.pixelSize);
                const y = Math.floor((e.clientY - rect.top) / this.pixelSize);
                
                if (x >= 0 && x < this.gridWidth && y >= 0 && y < this.gridHeight) {
                    const pickedColor = pixelData[y][x];
                    this.currentColor = pickedColor;
                    
                    const r = parseInt(pickedColor.substr(1, 2), 16);
                    const g = parseInt(pickedColor.substr(3, 2), 16);
                    const b = parseInt(pickedColor.substr(5, 2), 16);
                    
                    this.colorPicker.setColorFromRGB(r, g, b);
                }
            }
            
            paintPixel(e, variationIndex) {
                const canvas = this.canvasArray[variationIndex];
                const rect = canvas.getBoundingClientRect();
                const currentX = Math.floor((e.clientX - rect.left) / this.pixelSize);
                const currentY = Math.floor((e.clientY - rect.top) / this.pixelSize);
                
                if (currentX >= 0 && currentX < this.gridWidth && currentY >= 0 && currentY < this.gridHeight) {
                    // Save state before first pixel in stroke
                    if (!this.strokeStarted) {
                        this.historyManager.saveState(this.pixelDataArray, this.variations, this.gridWidth, this.gridHeight);
                        this.strokeStarted = true;
                    }
                    
                    // If we have a last position, draw a line from last to current
                    if (this.lastPixel && this.lastPixel.variation === variationIndex) {
                        this.drawLine(
                            this.lastPixel.x,
                            this.lastPixel.y,
                            currentX,
                            currentY,
                            (x, y) => {
                                this.paintPixelAt(x, y, variationIndex);
                            }
                        );
                    } else {
                        // Just paint the current pixel
                        this.paintPixelAt(currentX, currentY, variationIndex);
                    }
                    
                    // Update last position
                    this.lastPixel = { x: currentX, y: currentY, variation: variationIndex };
                }
            }
            
            paintPixelAt(x, y, variationIndex) {
                const ctx = this.ctxArray[variationIndex];
                const pixelData = this.pixelDataArray[variationIndex];
                
                if (x >= 0 && x < this.gridWidth && y >= 0 && y < this.gridHeight) {
                    pixelData[y][x] = this.currentColor;
                    
                    ctx.fillStyle = this.currentColor;
                    ctx.fillRect(
                        x * this.pixelSize,
                        y * this.pixelSize,
                        this.pixelSize,
                        this.pixelSize
                    );
                    
                    if (this.showGrid) {
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                        ctx.lineWidth = 1;
                        
                        if (x % this.gridSpacingX === 0) {
                            ctx.beginPath();
                            ctx.moveTo(x * this.pixelSize, y * this.pixelSize);
                            ctx.lineTo(x * this.pixelSize, (y + 1) * this.pixelSize);
                            ctx.stroke();
                        }
                        if ((x + 1) % this.gridSpacingX === 0) {
                            ctx.beginPath();
                            ctx.moveTo((x + 1) * this.pixelSize, y * this.pixelSize);
                            ctx.lineTo((x + 1) * this.pixelSize, (y + 1) * this.pixelSize);
                            ctx.stroke();
                        }
                        if (y % this.gridSpacingY === 0) {
                            ctx.beginPath();
                            ctx.moveTo(x * this.pixelSize, y * this.pixelSize);
                            ctx.lineTo((x + 1) * this.pixelSize, y * this.pixelSize);
                            ctx.stroke();
                        }
                        if ((y + 1) % this.gridSpacingY === 0) {
                            ctx.beginPath();
                            ctx.moveTo(x * this.pixelSize, (y + 1) * this.pixelSize);
                            ctx.lineTo((x + 1) * this.pixelSize, (y + 1) * this.pixelSize);
                            ctx.stroke();
                        }
                    }
                    
                    this.updateTexturePreview();
                }
            }
        }
        
        // Initialize the editor when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new PixelArtEditor();
        });
    </script>
</body>
</html>
